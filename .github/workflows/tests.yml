name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: idle-rpg-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: "4.7.2"

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: idle-rpg-godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"           || curl -fsSL --retry 3 -o godot.zip             "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip
          rm godot.zip
          mv "${name}" godot
          chmod +x godot

      - name: Run focused tests
        run: GODOT_BIN="$HOME/godot/godot" scripts/run_tests.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install playtest service dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Verify durable service and live Godot clients
        run: |
          python -m unittest server.test_service server.test_raids -v
          python -m server.verify_client --godot "$HOME/godot/godot"
